<div class="min-h-screen bg-canvas text-ink">
  <div class="grid min-h-screen grid-cols-[248px_minmax(0,1fr)]">
    <aside class="sticky top-0 flex h-screen flex-col bg-ink px-4 py-6">
      <a routerLink="/admin/dashboard" class="flex items-center gap-2.5 px-2" aria-label="Learning Hub Admin">
        <span
          class="flex h-9 w-9 items-center justify-center rounded-xl bg-marine text-[10px] font-semibold tracking-[0.02em] text-ink"
        >
          LH
        </span>
        <span class="text-[15px] font-semibold tracking-[-0.02em] text-white">Learning Hub</span>
      </a>

      <div class="mt-7 flex items-center gap-2 px-3">
        <span class="rounded-full border border-marine/25 bg-marine/10 px-2 py-1 text-[9px] font-semibold uppercase tracking-[0.14em] text-marine">
          Admin
        </span>
        <span class="text-[10px] text-mist/70">Bảng điều khiển</span>
      </div>

      <nav class="mt-6 flex flex-col gap-1" aria-label="Điều hướng quản trị">
        <a
          routerLink="/admin/dashboard"
          routerLinkActive="bg-white/10 text-white"
          class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-[12.5px] font-medium text-mist/75 transition hover:bg-white/[0.06] hover:text-white"
        >
          <svg viewBox="0 0 20 20" fill="none" class="h-4 w-4 shrink-0" aria-hidden="true">
            <rect x="3" y="3" width="5.5" height="5.5" rx="1.4" stroke="currentColor" stroke-width="1.5" />
            <rect x="11.5" y="3" width="5.5" height="5.5" rx="1.4" stroke="currentColor" stroke-width="1.5" />
            <rect x="3" y="11.5" width="5.5" height="5.5" rx="1.4" stroke="currentColor" stroke-width="1.5" />
            <rect x="11.5" y="11.5" width="5.5" height="5.5" rx="1.4" stroke="currentColor" stroke-width="1.5" />
          </svg>
          Tổng quan
        </a>
        <a
          routerLink="/admin/documents"
          routerLinkActive="bg-white/10 text-white"
          class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-[12.5px] font-medium text-mist/75 transition hover:bg-white/[0.06] hover:text-white"
        >
          <svg viewBox="0 0 20 20" fill="none" class="h-4 w-4 shrink-0" aria-hidden="true">
            <path d="M5 3.5h6.5L15 7v9.5A1.5 1.5 0 0 1 13.5 18h-8A1.5 1.5 0 0 1 4 16.5v-12A1 1 0 0 1 5 3.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
            <path d="m7 12 2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Phê duyệt bài viết
        </a>
        <a
          routerLink="/admin/subjects"
          routerLinkActive="bg-white/10 text-white"
          class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-[12.5px] font-medium text-mist/75 transition hover:bg-white/[0.06] hover:text-white"
        >
          <svg viewBox="0 0 20 20" fill="none" class="h-4 w-4 shrink-0" aria-hidden="true">
            <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a2 2 0 0 1 2 2v10a2 2 0 0 0-2-2H5.5A1.5 1.5 0 0 1 4 12.5v-7Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
            <path d="M16 5.5A1.5 1.5 0 0 0 14.5 4H12v12h2.5a1.5 1.5 0 0 0 1.5-1.5v-9Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
          </svg>
          Danh mục môn học
        </a>
        <a
          routerLink="/admin/users"
          routerLinkActive="bg-white/10 text-white"
          class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-[12.5px] font-medium text-mist/75 transition hover:bg-white/[0.06] hover:text-white"
        >
          <svg viewBox="0 0 20 20" fill="none" class="h-4 w-4 shrink-0" aria-hidden="true">
            <circle cx="7.25" cy="6.5" r="2.5" stroke="currentColor" stroke-width="1.5" />
            <path d="M2.8 15.5c.7-2.3 2.4-3.6 4.45-3.6 2.05 0 3.75 1.3 4.45 3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <path d="M13.2 5.8a2.5 2.5 0 0 1 0 4.8M14.2 12.4c1.4.4 2.4 1.5 2.9 3.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          Quản lý tài khoản
        </a>
        <a
          routerLink="/admin/broadcast"
          routerLinkActive="bg-white/10 text-white"
          class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-[12.5px] font-medium text-mist/75 transition hover:bg-white/[0.06] hover:text-white"
        >
          <svg viewBox="0 0 20 20" fill="none" class="h-4 w-4 shrink-0" aria-hidden="true">
            <path d="M3.5 8.5v3a1 1 0 0 0 1 1h2l3.5 2.5v-10L6.5 7.5h-2a1 1 0 0 0-1 1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
            <path d="M13.5 7.5c1.1 1.4 1.1 3.6 0 5M15.8 5c2 2.8 2 7.2 0 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          Thông báo hàng loạt
        </a>
        <a
          routerLink="/admin/settings"
          routerLinkActive="bg-white/10 text-white"
          class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-[12.5px] font-medium text-mist/75 transition hover:bg-white/[0.06] hover:text-white"
        >
          <svg viewBox="0 0 20 20" fill="none" class="h-4 w-4 shrink-0" aria-hidden="true">
            <circle cx="10" cy="10" r="2.4" stroke="currentColor" stroke-width="1.5" />
            <path d="M10 3.3v2M10 14.7v2M3.3 10h2M14.7 10h2M5.25 5.25l1.4 1.4M13.35 13.35l1.4 1.4M14.75 5.25l-1.4 1.4M6.65 13.35l-1.4 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          Cấu hình hệ thống
        </a>
      </nav>

      <div class="mt-auto border-t border-white/10 pt-4">
        <div class="flex items-center gap-3 px-3">
          <span class="flex h-8 w-8 items-center justify-center rounded-full bg-marine text-[10px] font-semibold text-ink">
            {{ adminInitials() }}
          </span>
          <span class="min-w-0 flex-1">
            <span class="block truncate text-[12px] font-semibold text-white">
              {{ auth.currentUser()?.fullName }}
            </span>
            <span class="mt-0.5 block text-[10px] text-mist/70">Toàn quyền</span>
          </span>
        </div>
        <button
          type="button"
          class="mt-3 flex w-full items-center gap-2 rounded-xl px-3 py-2 text-[11px] font-medium text-mist/70 transition hover:bg-white/[0.05] hover:text-white"
          (click)="logout()"
        >
          <svg viewBox="0 0 20 20" fill="none" class="h-3.5 w-3.5" aria-hidden="true">
            <path d="M8 4H5.5A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8M12.5 6.5 16 10l-3.5 3.5M8 10h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Đăng xuất
        </button>
      </div>
    </aside>

    <div class="flex min-w-0 flex-col">
      <header class="flex h-[64px] items-center justify-between border-b border-line bg-white px-8">
        <div class="flex items-center gap-2.5 text-[11px]">
          <span class="h-1.5 w-1.5 rounded-full bg-marine" aria-hidden="true"></span>
          <span class="font-medium text-muted">Learning Hub</span>
          <span class="text-mist" aria-hidden="true">/</span>
          <span class="font-semibold text-ink-soft">Không gian quản trị</span>
        </div>
        <span class="rounded-full border border-line bg-wash px-3 py-1.5 text-[10px] font-semibold uppercase tracking-[0.12em] text-muted">
          Chế độ quản trị
        </span>
      </header>

      <main class="app-scrollbar min-w-0 flex-1 px-8 py-8 xl:px-10 xl:py-9">
        <router-outlet />
      </main>
    </div>
  </div>
</div>
