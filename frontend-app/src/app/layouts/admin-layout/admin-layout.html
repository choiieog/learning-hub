<div class="min-h-screen bg-canvas text-ink">
  <div class="app-shell">
    <aside class="rail">
      <div class="rail-head">
        <a routerLink="/admin/dashboard" class="flex min-w-0 items-center gap-2" aria-label="Learning Hub Admin">
          <span class="rail-mark">LH</span>
          <span class="rail-wordmark truncate">Learning Hub</span>
        </a>
      </div>

      <nav class="rail-scroll" aria-label="Điều hướng quản trị">
        <div class="rail-group">
          <p class="rail-label">Vận hành</p>
          <a
            routerLink="/admin/dashboard"
            routerLinkActive="is-active"
            ariaCurrentWhenActive="page"
            aria-label="Tổng quan"
            class="rail-item"
          >
            <svg viewBox="0 0 20 20" fill="none" class="rail-icon" aria-hidden="true">
              <rect x="3" y="3" width="5.5" height="5.5" rx="1.4" stroke="currentColor" stroke-width="1.5" />
              <rect x="11.5" y="3" width="5.5" height="5.5" rx="1.4" stroke="currentColor" stroke-width="1.5" />
              <rect x="3" y="11.5" width="5.5" height="5.5" rx="1.4" stroke="currentColor" stroke-width="1.5" />
              <rect x="11.5" y="11.5" width="5.5" height="5.5" rx="1.4" stroke="currentColor" stroke-width="1.5" />
            </svg>
            <span>Tổng quan</span>
          </a>
          <a
            routerLink="/admin/documents"
            routerLinkActive="is-active"
            ariaCurrentWhenActive="page"
            aria-label="Phê duyệt bài viết"
            class="rail-item"
          >
            <svg viewBox="0 0 20 20" fill="none" class="rail-icon" aria-hidden="true">
              <path d="M5 3.5h6.5L15 7v9.5A1.5 1.5 0 0 1 13.5 18h-8A1.5 1.5 0 0 1 4 16.5v-12A1 1 0 0 1 5 3.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
              <path d="m7 12 2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span>Duyệt tài liệu</span>
          </a>
          <a
            routerLink="/admin/subjects"
            routerLinkActive="is-active"
            ariaCurrentWhenActive="page"
            aria-label="Danh mục môn học"
            class="rail-item"
          >
            <svg viewBox="0 0 20 20" fill="none" class="rail-icon" aria-hidden="true">
              <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a2 2 0 0 1 2 2v10a2 2 0 0 0-2-2H5.5A1.5 1.5 0 0 1 4 12.5v-7Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
              <path d="M16 5.5A1.5 1.5 0 0 0 14.5 4H12v12h2.5a1.5 1.5 0 0 0 1.5-1.5v-9Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
            </svg>
            <span>Môn học</span>
          </a>
        </div>

        <div class="rail-group">
          <p class="rail-label">Cộng đồng</p>
          <a
            routerLink="/admin/users"
            routerLinkActive="is-active"
            ariaCurrentWhenActive="page"
            aria-label="Quản lý tài khoản"
            class="rail-item"
          >
            <svg viewBox="0 0 20 20" fill="none" class="rail-icon" aria-hidden="true">
              <circle cx="7.25" cy="6.5" r="2.5" stroke="currentColor" stroke-width="1.5" />
              <path d="M2.8 15.5c.7-2.3 2.4-3.6 4.45-3.6 2.05 0 3.75 1.3 4.45 3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
              <path d="M13.2 5.8a2.5 2.5 0 0 1 0 4.8M14.2 12.4c1.4.4 2.4 1.5 2.9 3.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            <span>Quản lý tài khoản</span>
          </a>
          <a
            routerLink="/admin/broadcast"
            routerLinkActive="is-active"
            ariaCurrentWhenActive="page"
            aria-label="Thông báo hàng loạt"
            class="rail-item"
          >
            <svg viewBox="0 0 20 20" fill="none" class="rail-icon" aria-hidden="true">
              <path d="M3.5 8.5v3a1 1 0 0 0 1 1h2l3.5 2.5v-10L6.5 7.5h-2a1 1 0 0 0-1 1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
              <path d="M13.5 7.5c1.1 1.4 1.1 3.6 0 5M15.8 5c2 2.8 2 7.2 0 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            <span>Gửi thông báo</span>
          </a>
        </div>

        <div class="rail-group">
          <p class="rail-label">Hệ thống</p>
          <a
            routerLink="/admin/settings"
            routerLinkActive="is-active"
            ariaCurrentWhenActive="page"
            aria-label="Cấu hình hệ thống"
            class="rail-item"
          >
            <svg viewBox="0 0 20 20" fill="none" class="rail-icon" aria-hidden="true">
              <circle cx="10" cy="10" r="2.4" stroke="currentColor" stroke-width="1.5" />
              <path d="M10 3.3v2M10 14.7v2M3.3 10h2M14.7 10h2M5.25 5.25l1.4 1.4M13.35 13.35l1.4 1.4M14.75 5.25l-1.4 1.4M6.65 13.35l-1.4 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            <span>Cấu hình</span>
          </a>
        </div>
      </nav>

      <div class="rail-foot">
        <div class="rail-card">
          <span class="rail-card__eyebrow">Kiểm duyệt</span>
          <p class="rail-card__title">Giữ thư viện<br />rõ ràng.</p>
          <p class="rail-card__text">Duyệt tài liệu và xử lý cảnh báo trong một nhịp.</p>
          <a routerLink="/admin/documents" class="rail-card__action">
            Mở hàng chờ
            <svg viewBox="0 0 20 20" fill="none" class="h-3.5 w-3.5" aria-hidden="true">
              <path d="M4 10h12m-4.5-4.5L16 10l-4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </a>
        </div>
      </div>
    </aside>

    <div class="app-workspace">
      <header class="topbar">
        <form class="topbar-search" role="search" (submit)="search(searchInput.value, $event)">
          <label class="sr-only" for="admin-global-search">Tìm tài khoản</label>
          <svg viewBox="0 0 20 20" fill="currentColor" class="topbar-search__icon" aria-hidden="true">
            <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 1 0 3.4 9.8l3.15 3.15a.75.75 0 1 0 1.06-1.06l-3.15-3.15A5.5 5.5 0 0 0 9 3.5ZM5 9a4 4 0 1 1 8 0 4 4 0 0 1-8 0Z" clip-rule="evenodd" />
          </svg>
          <input
            #searchInput
            id="admin-global-search"
            type="search"
            name="q"
            autocomplete="off"
            placeholder="Tìm tài khoản theo tên, email..."
            aria-label="Tìm tài khoản"
          />
        </form>

        <div class="topbar-actions">
          <a routerLink="/admin/documents" class="topbar-btn" aria-label="Phê duyệt tài liệu">
            <svg viewBox="0 0 20 20" fill="none" class="h-[18px] w-[18px]" aria-hidden="true">
              <path d="m4 10 4 4 8-8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </a>
          <app-account-menu />
        </div>
      </header>

      <main class="app-scrollbar app-main min-w-0 flex-1">
        <router-outlet />
      </main>
    </div>
  </div>
</div>
