<div class="relative">
  <button
    type="button"
    class="account-menu-trigger"
    [attr.aria-expanded]="open()"
    aria-haspopup="menu"
    aria-label="Tài khoản"
    (click)="toggle()"
  >
    <app-avatar
      [avatarUrl]="user()?.avatarUrl ?? null"
      [frameUrl]="avatarFrame()"
      [name]="user()?.fullName ?? ''"
      [size]="40"
    />
    <span class="hidden min-w-0 xl:block">
      <span class="block max-w-[160px] truncate text-[13px] font-medium leading-5 text-ink">
        {{ user()?.fullName }}
      </span>
      <span class="mt-0.5 block max-w-[160px] truncate text-[11px] leading-4 text-muted">
        {{ user()?.email }}
      </span>
    </span>
    <svg
      viewBox="0 0 20 20"
      fill="none"
      class="account-menu-chevron hidden h-4 w-4 shrink-0 text-muted xl:block"
      [class.is-open]="open()"
      aria-hidden="true"
    >
      <path d="m6 8 4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  @if (open()) {
    <div class="fixed inset-0 z-30" (click)="close()" aria-hidden="true"></div>
    <div class="account-menu-panel absolute right-0 top-full z-40 mt-3 w-[272px] overflow-hidden rounded-[20px] border border-line bg-white shadow-[0_18px_40px_-18px_rgba(14,42,50,0.35)]">
      <div class="border-b border-line-soft px-4 py-3">
        <p class="truncate text-[13px] font-semibold text-ink">{{ user()?.fullName }}</p>
        <p class="mt-0.5 truncate text-[11px] text-muted">{{ user()?.email }}</p>
        <p class="mt-1.5 text-[9px] font-semibold uppercase tracking-[0.12em] text-tide">
          {{ roleLabel() }}
        </p>
      </div>

      <a
        [routerLink]="profileLink()"
        class="flex items-center gap-2.5 px-4 py-2.5 text-[13px] font-medium text-ink-soft transition hover:bg-wash hover:text-ink"
        (click)="close()"
      >
        <svg viewBox="0 0 20 20" fill="none" class="h-[18px] w-[18px] shrink-0" aria-hidden="true">
          <circle cx="10" cy="6.5" r="2.75" stroke="currentColor" stroke-width="1.5" />
          <path d="M4.5 16c.8-2.5 2.8-4 5.5-4s4.7 1.5 5.5 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        Thông tin cá nhân
      </a>

      <a
        [routerLink]="profileLink() + '/password'"
        class="flex items-center gap-2.5 px-4 py-2.5 text-[13px] font-medium text-ink-soft transition hover:bg-wash hover:text-ink"
        (click)="close()"
      >
        <svg viewBox="0 0 20 20" fill="none" class="h-[18px] w-[18px] shrink-0" aria-hidden="true">
          <rect x="4.5" y="8.5" width="11" height="7.5" rx="1.5" stroke="currentColor" stroke-width="1.5" />
          <path d="M7 8.5V6.8a3 3 0 0 1 6 0v1.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        Đổi mật khẩu
      </a>

      @if (!isAdmin()) {
        <a
          routerLink="/notifications"
          class="flex items-center gap-2.5 border-t border-line-soft px-4 py-2.5 text-[13px] font-medium text-ink-soft transition hover:bg-wash hover:text-ink"
          (click)="close()"
        >
          <svg viewBox="0 0 20 20" fill="none" class="h-[18px] w-[18px] shrink-0" aria-hidden="true">
            <path d="M5 8a5 5 0 0 1 10 0v2.2c0 .6.2 1.1.6 1.5l.8.9a.9.9 0 0 1-.7 1.4H4.3a.9.9 0 0 1-.7-1.4l.8-.9c.4-.4.6-.9.6-1.5V8Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
            <path d="M8 16.2a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <span class="flex-1">Thông báo</span>
          @if (unreadCount() > 0) {
            <span class="flex h-5 min-w-5 items-center justify-center rounded-full bg-ink px-1 text-[9px] font-semibold text-white">
              {{ unreadCount() > 9 ? '9+' : unreadCount() }}
            </span>
          }
        </a>
      }

      <div class="border-t border-line-soft p-1.5">
        <button
          type="button"
          class="flex w-full items-center gap-2.5 rounded-lg px-2.5 py-2 text-[13px] font-medium text-muted transition hover:bg-wash hover:text-ink"
          (click)="logout()"
        >
          <svg viewBox="0 0 20 20" fill="none" class="h-[18px] w-[18px] shrink-0" aria-hidden="true">
            <path d="M8 4H5.5A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8M12.5 6.5 16 10l-3.5 3.5M8 10h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Đăng xuất
        </button>
      </div>
    </div>
  }
</div>
