server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Multipart upload giới hạn 20MB trong app; nginx cần lớn hơn một chút cho overhead.
    client_max_body_size 25m;

    # API và file tài liệu (/api/files/...) chuyển thẳng tới backend.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA: mọi route do Angular xử lý.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html không cache để bản deploy mới được nhận ngay.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # File có hash trong tên nên cache dài hạn an toàn.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
